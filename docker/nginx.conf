user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request_id [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 30s;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=snapshot_api:10m rate=6r/m;

    upstream snapshot_backend {
        server snapshot:8080;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        client_max_body_size 1m;
        client_body_timeout 10s;
        send_timeout 40s;

        location = /health {
            access_log off;
            proxy_pass http://snapshot_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location / {
            limit_req zone=snapshot_api burst=3 nodelay;

            proxy_pass http://snapshot_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Server "";
            proxy_set_header X-Request-Id $request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout 35s;
            proxy_read_timeout 35s;
        }
    }
}
