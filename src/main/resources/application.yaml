ktor:
  deployment:
    host: 0.0.0.0
    port: 8080
    # 停机时先排水：停止接收新渲染请求，等待已接收请求收尾，超过上限后强制结束。
    # Netty 至少会等待 shutdownGracePeriod，因此不要设置得远大于实际渲染耗时。
    shutdownGracePeriod: 10000
    shutdownTimeout: 15000
  application:
    modules:
      - com.muedsa.snapshot.open.ObservabilityKt.configureLifecycle
      - com.muedsa.snapshot.open.HttpKt.configureHttp
      - com.muedsa.snapshot.open.SerializationKt.configureSerialization
      - com.muedsa.snapshot.open.RateLimitingKt.configureRateLimiting
      - com.muedsa.snapshot.open.ObservabilityKt.configureObservability
      - com.muedsa.snapshot.open.RoutingKt.configureRouting
      - com.muedsa.snapshot.open.ImageCacheKt.configureImageCache
      - com.muedsa.snapshot.open.FontConfigKt.configureFonts

snapshot:
  trust-proxy-headers: false
  max-request-size: 1048576
  max-concurrent-renders: 4
  max-render-timeout-ms: 30000
  # 文档结构硬限制：在递归构建 Widget 前检查，防止超深/超大元素树耗尽栈或 CPU。
  max-document-elements: 4096
  max-document-depth: 128
  # 渲染队列背压：等待槽位的请求上限与排队超时，超出时快速失败而不是无界堆积。
  max-render-queue: 32
  render-queue-timeout-ms: 5000
  # 渲染结果缓存：相同 DSL 直接返回上次输出，跳过解析与光栅化。
  render-cache:
    enabled: true
    max-entries: 256
    max-bytes: 67108864
    ttl-ms: 60000
  # 耗时响应头：Server-Timing 与 X-Snapshot-Cache / X-Snapshot-Image-Count。
  timing-headers:
    enabled: true
  # 解析错误高亮图：请求带 ?errorImage=png 时把解析错误渲染成图片。
  error-image:
    enabled: true
    max-lines: 8
    max-columns: 80
    context-lines: 2
  # 留空表示开放调用；填写后 /snapshot 需要 X-API-Key 或 Authorization: Bearer。
  # 需要多个 Key 时改用下面的 api-keys 列表或 SNAPSHOT_API_KEYS 环境变量。
  # 建议通过环境变量注入，避免出现在进程命令行里。
  api-key: ""
  # 多 Key 示例（name 用于日志、指标与限流分桶；admin=true 可访问管理接口）：
  # api-keys:
  #   - name: web-frontend
  #     key: ""
  #   - name: ops
  #     key: ""
  #     admin: true
  access-log-enabled: true
  access-log-skip-paths:
    - /health
    - /ready
    - /metrics
  metrics-enabled: true
  # /metrics 访问控制：open（默认）、credential（需要 API Key）、admin（需要管理凭据）。
  metrics-access: open
  rate-limit:
    # 匿名调用方：按来源 IP 计桶。
    requests: 6
    window-ms: 60000
    # 已认证调用方：按凭据计桶。
    credential-requests: 60
    credential-window-ms: 60000
    # 管理接口（字体预览图等）：按管理凭据或来源 IP 计桶。
    admin-requests: 6
    admin-window-ms: 60000
  max-canvas-width: 4096
  max-canvas-height: 4096
  max-canvas-pixels: 16777216
  admin-endpoints-enabled: false
  cors:
    allowed-hosts:
      - localhost:3000
      - 127.0.0.1:3000
  font-family-names:
    - Inter
    - Noto Serif SC
    - DejaVu Serif
    - Noto Color Emoji
  image:
    max-image-num-once: 10
    max-single-image-size: 5242880
    memory-cache-num-limit: 100
    max-cache-bytes: 268435456
    max-image-width: 4096
    max-image-height: 4096
    max-image-pixels: 16777216
    # 单次渲染内 URL 与 Data URI 图片解码后的总像素上限（约束本地内存放大）。
    max-total-image-pixels: 16777216
    allow-private-hosts: false
    connect-timeout-ms: 10000
    read-timeout-ms: 10000
    # 图片缓存 TTL：0 表示永不过期；过期后用 ETag 做条件请求复用图片。
    cache-ttl-ms: 600000
    # 瞬时失败（5xx、超时、IO）的重试次数与退避基数。
    max-retries: 1
    retry-backoff-ms: 200
