services:
  snapshot:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - gpr_user
        - gpr_key
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SNAPSHOT_MAX_REQUEST_SIZE: "${SNAPSHOT_MAX_REQUEST_SIZE:-}"
      SNAPSHOT_MAX_CONCURRENT_RENDERS: "${SNAPSHOT_MAX_CONCURRENT_RENDERS:-}"
      SNAPSHOT_MAX_RENDER_TIMEOUT_MS: "${SNAPSHOT_MAX_RENDER_TIMEOUT_MS:-}"
      SNAPSHOT_RATE_LIMIT_REQUESTS: "${SNAPSHOT_RATE_LIMIT_REQUESTS:-}"
      SNAPSHOT_RATE_LIMIT_WINDOW_MS: "${SNAPSHOT_RATE_LIMIT_WINDOW_MS:-}"
      SNAPSHOT_MAX_CANVAS_WIDTH: "${SNAPSHOT_MAX_CANVAS_WIDTH:-}"
      SNAPSHOT_MAX_CANVAS_HEIGHT: "${SNAPSHOT_MAX_CANVAS_HEIGHT:-}"
      SNAPSHOT_MAX_CANVAS_PIXELS: "${SNAPSHOT_MAX_CANVAS_PIXELS:-}"
      SNAPSHOT_TRUST_PROXY_HEADERS: "${SNAPSHOT_TRUST_PROXY_HEADERS:-true}"
      SNAPSHOT_ADMIN_ENDPOINTS_ENABLED: "${SNAPSHOT_ADMIN_ENDPOINTS_ENABLED:-}"
      SNAPSHOT_ADMIN_TOKEN: "${SNAPSHOT_ADMIN_TOKEN:-}"
      SNAPSHOT_MAX_IMAGE_NUM: "${SNAPSHOT_MAX_IMAGE_NUM:-}"
      SNAPSHOT_MAX_SINGLE_IMAGE_SIZE: "${SNAPSHOT_MAX_SINGLE_IMAGE_SIZE:-}"
      SNAPSHOT_MEMORY_CACHE_NUM_LIMIT: "${SNAPSHOT_MEMORY_CACHE_NUM_LIMIT:-}"
      SNAPSHOT_MAX_CACHE_BYTES: "${SNAPSHOT_MAX_CACHE_BYTES:-}"
      SNAPSHOT_MAX_IMAGE_WIDTH: "${SNAPSHOT_MAX_IMAGE_WIDTH:-}"
      SNAPSHOT_MAX_IMAGE_HEIGHT: "${SNAPSHOT_MAX_IMAGE_HEIGHT:-}"
      SNAPSHOT_MAX_IMAGE_PIXELS: "${SNAPSHOT_MAX_IMAGE_PIXELS:-}"
      SNAPSHOT_ALLOW_PRIVATE_HOSTS: "${SNAPSHOT_ALLOW_PRIVATE_HOSTS:-}"
    volumes:
      - "${SNAPSHOT_CONFIG_FILE:-./src/main/resources/application.yaml}:/app/config/application.yaml:ro"
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - snapshot-internal

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      snapshot:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    networks:
      - snapshot-internal

networks:
  snapshot-internal:
    driver: bridge

secrets:
  gpr_user:
    file: ./.secrets/gpr_user
  gpr_key:
    file: ./.secrets/gpr_key
