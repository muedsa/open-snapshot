services:
  snapshot:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - gpr_user
        - gpr_key
    restart: unless-stopped
    # Docker 先发 SIGTERM，应用最多需要 10s 排水 + 15s 收尾，这里留出余量。
    stop_grace_period: 30s
    expose:
      - "8080"
    environment:
      SNAPSHOT_SERVER_HOST: "${SNAPSHOT_SERVER_HOST:-}"
      SNAPSHOT_SERVER_PORT: "${SNAPSHOT_SERVER_PORT:-}"
      SNAPSHOT_MAX_REQUEST_SIZE: "${SNAPSHOT_MAX_REQUEST_SIZE:-}"
      SNAPSHOT_MAX_CONCURRENT_RENDERS: "${SNAPSHOT_MAX_CONCURRENT_RENDERS:-}"
      SNAPSHOT_MAX_RENDER_TIMEOUT_MS: "${SNAPSHOT_MAX_RENDER_TIMEOUT_MS:-}"
      SNAPSHOT_MAX_DOCUMENT_ELEMENTS: "${SNAPSHOT_MAX_DOCUMENT_ELEMENTS:-}"
      SNAPSHOT_MAX_DOCUMENT_DEPTH: "${SNAPSHOT_MAX_DOCUMENT_DEPTH:-}"
      SNAPSHOT_MAX_RENDER_QUEUE: "${SNAPSHOT_MAX_RENDER_QUEUE:-}"
      SNAPSHOT_RENDER_QUEUE_TIMEOUT_MS: "${SNAPSHOT_RENDER_QUEUE_TIMEOUT_MS:-}"
      SNAPSHOT_RENDER_CACHE_ENABLED: "${SNAPSHOT_RENDER_CACHE_ENABLED:-}"
      SNAPSHOT_RENDER_CACHE_MAX_ENTRIES: "${SNAPSHOT_RENDER_CACHE_MAX_ENTRIES:-}"
      SNAPSHOT_RENDER_CACHE_MAX_BYTES: "${SNAPSHOT_RENDER_CACHE_MAX_BYTES:-}"
      SNAPSHOT_RENDER_CACHE_TTL_MS: "${SNAPSHOT_RENDER_CACHE_TTL_MS:-}"
      SNAPSHOT_ERROR_IMAGE_ENABLED: "${SNAPSHOT_ERROR_IMAGE_ENABLED:-}"
      SNAPSHOT_ERROR_IMAGE_MAX_LINES: "${SNAPSHOT_ERROR_IMAGE_MAX_LINES:-}"
      SNAPSHOT_ERROR_IMAGE_MAX_COLUMNS: "${SNAPSHOT_ERROR_IMAGE_MAX_COLUMNS:-}"
      SNAPSHOT_ERROR_IMAGE_CONTEXT_LINES: "${SNAPSHOT_ERROR_IMAGE_CONTEXT_LINES:-}"
      SNAPSHOT_TIMING_HEADERS_ENABLED: "${SNAPSHOT_TIMING_HEADERS_ENABLED:-}"
      SNAPSHOT_ACCESS_LOG_ENABLED: "${SNAPSHOT_ACCESS_LOG_ENABLED:-}"
      SNAPSHOT_METRICS_ENABLED: "${SNAPSHOT_METRICS_ENABLED:-}"
      SNAPSHOT_SHUTDOWN_GRACE_MS: "${SNAPSHOT_SHUTDOWN_GRACE_MS:-}"
      SNAPSHOT_SHUTDOWN_TIMEOUT_MS: "${SNAPSHOT_SHUTDOWN_TIMEOUT_MS:-}"
      SNAPSHOT_RATE_LIMIT_REQUESTS: "${SNAPSHOT_RATE_LIMIT_REQUESTS:-}"
      SNAPSHOT_RATE_LIMIT_WINDOW_MS: "${SNAPSHOT_RATE_LIMIT_WINDOW_MS:-}"
      SNAPSHOT_RATE_LIMIT_CREDENTIAL_REQUESTS: "${SNAPSHOT_RATE_LIMIT_CREDENTIAL_REQUESTS:-}"
      SNAPSHOT_RATE_LIMIT_CREDENTIAL_WINDOW_MS: "${SNAPSHOT_RATE_LIMIT_CREDENTIAL_WINDOW_MS:-}"
      SNAPSHOT_RATE_LIMIT_ADMIN_REQUESTS: "${SNAPSHOT_RATE_LIMIT_ADMIN_REQUESTS:-}"
      SNAPSHOT_RATE_LIMIT_ADMIN_WINDOW_MS: "${SNAPSHOT_RATE_LIMIT_ADMIN_WINDOW_MS:-}"
      SNAPSHOT_METRICS_ACCESS: "${SNAPSHOT_METRICS_ACCESS:-}"
      SNAPSHOT_MAX_CANVAS_WIDTH: "${SNAPSHOT_MAX_CANVAS_WIDTH:-}"
      SNAPSHOT_MAX_CANVAS_HEIGHT: "${SNAPSHOT_MAX_CANVAS_HEIGHT:-}"
      SNAPSHOT_MAX_CANVAS_PIXELS: "${SNAPSHOT_MAX_CANVAS_PIXELS:-}"
      SNAPSHOT_TRUST_PROXY_HEADERS: "${SNAPSHOT_TRUST_PROXY_HEADERS:-true}"
      # 列表配置：用英文逗号分隔多个值。
      SNAPSHOT_CORS_ALLOWED_HOSTS: "${SNAPSHOT_CORS_ALLOWED_HOSTS:-}"
      SNAPSHOT_FONT_FAMILY_NAMES: "${SNAPSHOT_FONT_FAMILY_NAMES:-}"
      SNAPSHOT_ACCESS_LOG_SKIP_PATHS: "${SNAPSHOT_ACCESS_LOG_SKIP_PATHS:-}"
      SNAPSHOT_ADMIN_ENDPOINTS_ENABLED: "${SNAPSHOT_ADMIN_ENDPOINTS_ENABLED:-}"
      SNAPSHOT_ADMIN_TOKEN: "${SNAPSHOT_ADMIN_TOKEN:-}"
      SNAPSHOT_ANONYMOUS_ACCESS_ENABLED: "${SNAPSHOT_ANONYMOUS_ACCESS_ENABLED:-}"
      SNAPSHOT_MAX_IMAGE_NUM: "${SNAPSHOT_MAX_IMAGE_NUM:-}"
      SNAPSHOT_MAX_SINGLE_IMAGE_SIZE: "${SNAPSHOT_MAX_SINGLE_IMAGE_SIZE:-}"
      SNAPSHOT_MEMORY_CACHE_NUM_LIMIT: "${SNAPSHOT_MEMORY_CACHE_NUM_LIMIT:-}"
      SNAPSHOT_MAX_CACHE_BYTES: "${SNAPSHOT_MAX_CACHE_BYTES:-}"
      SNAPSHOT_MAX_IMAGE_WIDTH: "${SNAPSHOT_MAX_IMAGE_WIDTH:-}"
      SNAPSHOT_MAX_IMAGE_HEIGHT: "${SNAPSHOT_MAX_IMAGE_HEIGHT:-}"
      SNAPSHOT_MAX_IMAGE_PIXELS: "${SNAPSHOT_MAX_IMAGE_PIXELS:-}"
      SNAPSHOT_MAX_TOTAL_IMAGE_PIXELS: "${SNAPSHOT_MAX_TOTAL_IMAGE_PIXELS:-}"
      SNAPSHOT_ALLOW_PRIVATE_HOSTS: "${SNAPSHOT_ALLOW_PRIVATE_HOSTS:-}"
      SNAPSHOT_IMAGE_CONNECT_TIMEOUT_MS: "${SNAPSHOT_IMAGE_CONNECT_TIMEOUT_MS:-}"
      SNAPSHOT_IMAGE_READ_TIMEOUT_MS: "${SNAPSHOT_IMAGE_READ_TIMEOUT_MS:-}"
      SNAPSHOT_IMAGE_CACHE_TTL_MS: "${SNAPSHOT_IMAGE_CACHE_TTL_MS:-}"
      SNAPSHOT_IMAGE_MAX_RETRIES: "${SNAPSHOT_IMAGE_MAX_RETRIES:-}"
      SNAPSHOT_IMAGE_RETRY_BACKOFF_MS: "${SNAPSHOT_IMAGE_RETRY_BACKOFF_MS:-}"
      # 直接透传给 JVM 环境变量，不经过命令行参数，避免密钥出现在进程列表里。
      SNAPSHOT_API_KEY: "${SNAPSHOT_API_KEY:-}"
      SNAPSHOT_API_KEYS: "${SNAPSHOT_API_KEYS:-}"
    volumes:
      - "${SNAPSHOT_CONFIG_FILE:-./src/main/resources/application.yaml}:/app/config/application.yaml:ro"
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - snapshot-internal

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      snapshot:
        # 依赖 /health（存活）即可启动；就绪状态由 /ready 暴露给外层负载均衡。
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    networks:
      - snapshot-internal

networks:
  snapshot-internal:
    driver: bridge

secrets:
  gpr_user:
    file: ./.secrets/gpr_user
  gpr_key:
    file: ./.secrets/gpr_key
