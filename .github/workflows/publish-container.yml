name: Build and publish container image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GPR_USER: ${{ secrets.SNAPSHOT_GPR_USER || github.actor }}
  GPR_KEY: ${{ secrets.SNAPSHOT_GPR_KEY || secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Test, build and publish container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew --no-daemon test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: open-snapshot:smoke
          cache-from: type=gha
          platforms: linux/amd64
          build-args: |
            DEPENDENCY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            gpr_user=${{ env.GPR_USER }}
            gpr_key=${{ env.GPR_KEY }}

      - name: Smoke test container rendering
        shell: bash
        run: |
          set -euo pipefail

          container_name="open-snapshot-smoke"
          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1:18080:8080 \
            open-snapshot:smoke

          cleanup() {
            docker logs "$container_name" || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health; then
              ready=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container_name" | grep --quiet '^true$'; then
              echo "Container exited before becoming ready"
              exit 1
            fi
            sleep 2
          done

          if [[ "$ready" != "true" ]]; then
            echo "Container did not become ready in time"
            exit 1
          fi

          curl --fail --silent --show-error \
            --header 'Content-Type: text/plain' \
            --data-binary '<Snapshot type="png"><Container width="2" height="2" color="#FFFF0000"/></Snapshot>' \
            --output /tmp/open-snapshot-smoke.png \
            http://127.0.0.1:18080/snapshot

          png_signature="$(od -An -tx1 -N8 /tmp/open-snapshot-smoke.png | tr -d ' \n')"
          test "$png_signature" = "89504e470d0a1a0a"

          curl --fail --silent --show-error http://127.0.0.1:18080/ready

          curl --fail --silent --show-error http://127.0.0.1:18080/metrics \
            > /tmp/open-snapshot-metrics.txt
          grep --quiet 'snapshot_renders_total{outcome="success"}' /tmp/open-snapshot-metrics.txt
          grep --quiet 'snapshot_render_duration_seconds_count' /tmp/open-snapshot-metrics.txt

          # 优雅停机：SIGTERM 后先进入排水阶段并输出生命周期日志。
          docker stop --timeout 30 "$container_name"
          docker logs "$container_name" > /tmp/open-snapshot-logs.txt 2>&1
          grep --quiet 'phase=stop-preparing' /tmp/open-snapshot-logs.txt
          grep --quiet 'phase=stopped' /tmp/open-snapshot-logs.txt

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          build-args: |
            DEPENDENCY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            gpr_user=${{ env.GPR_USER }}
            gpr_key=${{ env.GPR_KEY }}
